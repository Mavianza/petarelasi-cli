[project]
name = "petarelasi"
version = "1.2.0"
description = "ERD Draw.io dan SVG dari SQLite, ekspor SQL dan koneksi database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
app = ["PySide6-Essentials==6.10.2", "sqlglot==30.31.0"]
sql = ["sqlglot==30.31.0"]
postgres = ["SQLAlchemy==2.0.57", "psycopg[binary]==3.3.8"]
mysql = ["SQLAlchemy==2.0.57", "PyMySQL==1.2.4"]
all = ["PySide6-Essentials==6.10.2", "sqlglot==30.31.0", "SQLAlchemy==2.0.57", "psycopg[binary]==3.3.8", "PyMySQL==1.2.4"]

[project.scripts]
petarelasi = "petarelasi.__main__:main"
petarelasi-studio = "petarelasi.studio:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["petarelasi*"]
